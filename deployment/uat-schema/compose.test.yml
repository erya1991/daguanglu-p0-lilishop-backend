# Independent TEST/MOCK resources only. Supply P0_RUN_DIR and P0_RUN_ID.
# These are infrastructure services, not the application APIs.
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
    ports:
      - "127.0.0.1:${P0_MYSQL_PORT:-19706}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ${P0_RUN_DIR:?run directory required}/private/mysql-root-password:/run/secrets/mysql-root-password:ro
      - ${P0_RUN_DIR:?run directory required}/private/mysql-root-container.cnf:/run/secrets/mysql-root.cnf:ro
    labels:
      dgl.uat.run: ${P0_RUN_ID:?run identifier required}
      dgl.uat.purpose: wechat-test
  redis:
    image: redis:7.2-alpine
    user: "0:0"
    entrypoint: ["redis-server"]
    command: ["/run/secrets/redis.conf"]
    ports:
      - "127.0.0.1:${P0_REDIS_PORT:-19779}:6379"
    volumes:
      - redis-data:/data
      - ${P0_RUN_DIR:?run directory required}/private/redis.conf:/run/secrets/redis.conf:ro
    labels:
      dgl.uat.run: ${P0_RUN_ID:?run identifier required}
      dgl.uat.purpose: wechat-test
volumes:
  mysql-data:
    labels:
      dgl.uat.run: ${P0_RUN_ID:?run identifier required}
      dgl.uat.purpose: wechat-test
  redis-data:
    labels:
      dgl.uat.run: ${P0_RUN_ID:?run identifier required}
      dgl.uat.purpose: wechat-test
